[project]
name = "vlm-vad-anyanomaly"
version = "0"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==5.24.0",
    "accelerate",
    "bitsandbytes==0.50.2",
    "flash-linear-attention",
    "sentencepiece",
    "timm",
    "Pillow",
    "numpy<2",
    "matplotlib",
    "scipy",
    "h5py",
    "fastprogress",
    "scikit-learn",
    "openai-clip",
    "opencv-python==4.10.0.84",
    "setuptools==69.5.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
