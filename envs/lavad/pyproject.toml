[project]
name = "vlm-vad-lavad"
version = "0"
requires-python = "==3.10.*"
dependencies = [
    "accelerate>=1.2.1",
    "cartopy>=0.25.0",
    "einops>=0.8.2",
    "eva-decord==0.6.1",
    "fairscale>=0.4.13",
    "faiss-cpu>=1.16.0",
    "fire>=0.7.1",
    "ftfy>=6.3.1",
    "fvcore>=0.1.5.post20221221",
    "iopath>=0.1.10",
    "matplotlib>=3.10.9",
    "numpy>=1.19",
    "opencv-python>=4.11.0.86",
    "pre-commit>=4.6.2",
    "pytorchvideo",
    "regex>=2026.9.29",
    "scikit-learn>=1.7.2",
    "sentencepiece>=0.2.3",
    "timm==0.6.7",
    "torch==1.13.0",
    "torchaudio==0.13.0",
    "torchvision==0.14.0",
    "transformers==4.31.0",
    "types-regex>=2026.11.15.20261116",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
constraint-dependencies = ["numpy<2"]

[tool.uv.sources]
pytorchvideo = { git = "https://github.com/facebookresearch/pytorchvideo.git", rev = "28fe037d212663c6a24f373b94cc5d478c8c1a1d" }
